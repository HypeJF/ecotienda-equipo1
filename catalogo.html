<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo · AhorraPlus</title>
    <!-- CSS y Fuentes -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/tienda.js" defer></script>
</head>
<body class="container py-3">
    <!-- Encabezado y Menú -->
    <header class="encabezado d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
        <div class="mb-3 mb-md-0">
            <h1 class="mb-1">Catálogo</h1>
            <p class="mb-0">Cada producto dice cuánto le ahorra al mes, con una tarifa de 950 COP/kWh.</p>
        </div>
        
        <nav class="menu d-flex align-items-center gap-3">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html" class="activo">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
            
            <!-- Botón del carrito (Offcanvas) -->
            <button class="btn btn-primary d-flex align-items-center ms-2 fw-bold shadow-sm" type="button" data-bs-toggle="offcanvas" data-bs-target="#carritoOffcanvas" aria-controls="carritoOffcanvas">
                <i class="bi bi-cart-fill fs-5 me-2"></i>
                <span>Carrito</span>
                <span class="badge bg-light text-primary ms-2 rounded-pill" id="contador-carrito">0</span>
            </button>
        </nav>
    </header>

    <main>
        <!-- Filtros -->
        <div class="mb-4">
            <input type="text" id="buscador" class="form-control mb-3" placeholder="Buscar producto por nombre (ej. Nevera, Panel...)">
            <div class="filtros">
                <button class="filtro activo" data-categoria="todas">Todas</button>
                <button class="filtro" data-categoria="iluminacion">Iluminación</button>
                <button class="filtro" data-categoria="electrodomesticos">Electrodomésticos</button>
                <button class="filtro" data-categoria="solar">Energía solar</button>
                <button class="filtro" data-categoria="domotica">Domótica</button>
                <button class="filtro" data-categoria="cocina">Cocina Eficiente</button>
            </div>
        </div>
        
        <!-- Catálogo de productos -->
        <div class="catalogo">
            <div id="productos" class="tarjetas"></div>
        </div>

        <div class="d-block d-sm-none mt-5 mb-4">
            <aside class="carrito-estatico p-4 border border-primary rounded-3 shadow-sm bg-white">
                <h2 class="fs-4 text-primary fw-bold mb-3">Carrito (Versión Móvil)</h2>
                <ul class="lista-carrito ps-0 mb-3" style="list-style: none;"></ul>
                <div class="border-top pt-3">
                    <p class="total-carrito fw-bold mb-1"></p>
                    <p class="ahorro-carrito text-success fw-bold"></p>
                    <button class="btn-vaciar btn btn-outline-secondary btn-sm w-100 mt-2">Vaciar carrito</button>
                </div>
            </aside>
        </div>
    </main>

    <!-- Contenedor del Carrito (Offcanvas) -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="carritoOffcanvas" aria-labelledby="carritoOffcanvasLabel">
        <div class="offcanvas-header">
            <h2 class="fs-4 text-primary fw-bold mb-0" id="carritoOffcanvasLabel">Tu Carrito</h2>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <aside class="flex-grow-1 d-flex flex-column">
                <ul class="lista-carrito ps-0 mb-3 flex-grow-1" style="list-style: none;"></ul>
                <div class="mt-auto border-top pt-3">
                    <p class="total-carrito fw-bold mb-1"></p>
                    <p class="ahorro-carrito text-success fw-bold"></p>
                    <button class="btn-vaciar btn btn-outline-secondary btn-sm w-100 mt-2">Vaciar carrito</button>
                </div>
            </aside>
        </div>
    </div>

    <!-- Pie de página -->
    <footer class="pie text-center mt-5 border-top pt-3">
        <p>IU Digital de Antioquia · 2026-2</p>
    </footer>

    <!-- Script de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
